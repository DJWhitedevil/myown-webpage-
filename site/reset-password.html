<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CodeMint</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Local Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-neobrutalism.css">
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            background: #f3eee7;
        }

        body.reset-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #4a453d;
        }

        .reset-page .login-overlay {
            position: static;
            display: block !important;
            width: 100%;
            max-width: 440px;
            padding: 0;
            background: transparent;
            overflow: visible;
        }

        .reset-page .login-card {
            width: 100%;
            padding: 36px;
            background: rgba(255, 255, 255, 0.72);
            border-radius: 24px;
            box-shadow: 12px 12px 24px rgba(125, 108, 92, 0.14), -10px -10px 20px rgba(255, 255, 255, 0.7);
        }

        .reset-page .section-title {
            margin-bottom: 12px;
            color: #4a453d;
            font-size: clamp(28px, 7vw, 42px);
        }

        .reset-page .login-form {
            display: grid;
            gap: 16px;
        }

        .reset-page .form-group {
            margin: 0 !important;
        }

        .reset-page .form-input {
            width: 100%;
            min-height: 54px;
            color: #4a453d !important;
        }

        .reset-page .btn {
            min-height: 54px;
            cursor: pointer;
        }

        .reset-page .btn:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .reset-page .login-error {
            overflow-wrap: anywhere;
        }

        @media (max-width: 520px) {
            body.reset-page { padding: 16px; }
            .reset-page .login-card { padding: 28px 20px; }
        }
    </style>
</head>
<body class="reset-page">

    <div id="loginOverlay" class="login-overlay" style="display: flex; align-items: center; justify-content: center;">
        <div class="login-card" id="resetCard">
            <h2 class="section-title">Reset Password</h2>
            <p style="margin-bottom: 1.5rem;">Enter your new password below.</p>
            <form id="resetForm" class="login-form">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <input type="password" id="newPassword" class="form-input" placeholder="New Password (12+ characters)" minlength="12" maxlength="128" required>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm New Password" minlength="12" maxlength="128" required>
                </div>
                <button type="submit" id="resetSubmitBtn" class="btn btn-primary" style="width: 100%; display: flex; justify-content: center;">
                    <span>Update Password</span>
                </button>
                <div style="text-align: center; margin-top: 1.5rem;">
                    <a href="login.html" style="font-size: 0.9rem; color: var(--text-primary); text-decoration: underline; font-weight: 600;">Back to Login</a>
                </div>
                <div id="resetMessage" class="login-error" style="display: none; margin-top: 1rem; font-weight: 700; border-radius: 16px; padding: 0.75rem 1rem; background: rgba(255,255,255,0.35); box-shadow: inset 3px 3px 7px rgba(104, 91, 76, .13), inset -3px -3px 7px rgba(255, 250, 243, .65);"></div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const supabase = window.CodeMintAuth;
            const resetForm = document.getElementById('resetForm');
            const resetMessage = document.getElementById('resetMessage');
            const submitBtn = document.getElementById('resetSubmitBtn');

            const showMessage = (message, color = '#ff3333') => {
                resetMessage.style.display = 'block';
                resetMessage.style.color = color;
                resetMessage.innerText = message;
            };

            if (!supabase) {
                showMessage('Supabase is not configured. Add your project URL and publishable anon key to supabase-config.js.');
                submitBtn.disabled = true;
                return;
            }

            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                showMessage('This reset link is invalid or expired. Please request a new one.');
                submitBtn.disabled = true;
                return;
            }

            resetForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (newPassword.length < 12) return showMessage('Password must be at least 12 characters.');
                if (newPassword !== confirmPassword) return showMessage('Passwords do not match.');

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Updating...</span>';
                resetMessage.style.display = 'none';

                const { error } = await supabase.auth.updateUser({ password: newPassword });
                if (error) {
                    showMessage(error.message || 'Failed to reset password.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Update Password</span>';
                    return;
                }

                await supabase.auth.signOut();
                showMessage('Password updated successfully. Redirecting to login...', '#008744');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            });
        });
    </script>
</body>
</html>
