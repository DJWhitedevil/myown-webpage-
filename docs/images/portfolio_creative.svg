<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#070707; font-family:'Plus Jakarta Sans', sans-serif;">
  <defs>
    <!-- Glow filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.015)" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Solid Obsidian Background -->
  <rect width="100%" height="100%" fill="#070707" />
  <rect width="100%" height="100%" fill="url(#archGrid)" />

  <!-- Background Ambient Glow -->
  <circle cx="650" cy="150" r="160" fill="#F59E0B" opacity="0.08" filter="url(#amberGlow)" />
  <circle cx="150" cy="350" r="180" fill="#EF4444" opacity="0.06" filter="url(#amberGlow)" />

  <!-- MAIN CANVAS BROWSER WRAPPER -->
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#0D0D0D" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1.5" />
  
  <!-- Browser Header -->
  <path d="M 50 52 A 12 12 0 0 1 62 40 L 738 40 A 12 12 0 0 1 750 52 L 750 75 L 50 75 Z" fill="#0A0A0A" />
  <circle cx="75" cy="57" r="5" fill="#1A1A1A" />
  <circle cx="91" cy="57" r="5" fill="#1A1A1A" />
  <circle cx="107" cy="57" r="5" fill="#1A1A1A" />

  <!-- Site Logo & Menu items -->
  <text x="150" y="62" font-family="'Plus Jakarta Sans', Georgia, serif" font-weight="800" font-size="16" fill="#FFFFFF" letter-spacing="2">A T M O S</text>
  
  <g opacity="0.4">
    <rect x="420" y="55" width="40" height="4" rx="2" fill="#FFFFFF" />
    <rect x="480" y="55" width="50" height="4" rx="2" fill="#FFFFFF" />
    <rect x="550" y="55" width="45" height="4" rx="2" fill="#FFFFFF" />
  </g>
  
  <!-- Contact button in Nav -->
  <rect x="640" y="47" width="80" height="20" rx="10" fill="none" stroke="#F59E0B" stroke-width="1" />
  <text x="680" y="60" font-size="9" font-weight="700" fill="#F59E0B" text-anchor="middle">LET'S TALK</text>

  <!-- CREATIVE PORTFOLIO CONTENTS -->
  
  <!-- Architectural Wireframe Structure (Abstract Design element) -->
  <g transform="translate(420, 110)" opacity="0.75">
    <!-- Perspective Grids -->
    <path d="M 20 200 L 260 200 L 140 30 Z" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Floor Grid perspective lines -->
    <line x1="20" y1="200" x2="140" y2="240" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <line x1="260" y1="200" x2="140" y2="240" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <line x1="140" y1="30" x2="140" y2="240" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    
    <!-- Abstract 3D boxes in wireframe -->
    <!-- Box 1 -->
    <polygon points="60,180 140,160 140,90 60,110" fill="rgba(245, 158, 11, 0.05)" stroke="url(#amberGrad)" stroke-width="2" />
    <polygon points="140,160 220,175 220,105 140,90" fill="rgba(245, 158, 11, 0.02)" stroke="url(#amberGrad)" stroke-width="1.5" />
    <polygon points="60,110 140,90 220,105 140,125" fill="none" stroke="url(#amberGrad)" stroke-width="1.5" stroke-dasharray="2,2" />
    
    <!-- Box 2 (Floating overlay) -->
    <polygon points="100,80 180,65 180,35 100,50" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
    <polygon points="180,65 240,75 240,45 180,35" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>
    
    <!-- Coordinate markers -->
    <circle cx="140" cy="90" r="3" fill="#FFFFFF" />
    <circle cx="60" cy="180" r="3" fill="#EF4444" />
    <circle cx="220" cy="175" r="3" fill="#EF4444" />
  </g>

  <!-- Left Side: Editorial Headers -->
  <g transform="translate(100, 140)">
    
    <text x="0" y="20" font-size="10" font-weight="800" fill="#F59E0B" letter-spacing="3">FEATURING WORK</text>
    
    <!-- Immersive Serif Headers -->
    <text x="0" y="65" font-family="Georgia, serif" font-style="italic" font-size="42" font-weight="400" fill="#FFFFFF" letter-spacing="1">Minimalism</text>
    <text x="0" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Redefined.</text>
    
    <text x="0" y="155" font-size="13" fill="#64748B" line-height="1.6">Exploring the deep relationship between structural</text>
    <text x="0" y="173" font-size="13" fill="#64748B">brutalism and dynamic natural lighting ecosystems.</text>
    
    <!-- Project Index Indicator -->
    <g transform="translate(0, 210)">
      <line x1="0" y1="10" x2="60" y2="10" stroke="#F59E0B" stroke-width="2" />
      <line x1="65" y1="10" x2="160" y2="10" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="180" y="14" font-size="12" font-weight="700" fill="#FFFFFF">01 / 04</text>
    </g>
  </g>
</svg>
