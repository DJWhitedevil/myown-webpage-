<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#FAF8F5; font-family:'Plus Jakarta Sans', serif;">
  <defs>
    <!-- Card shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.04" />
    </filter>
    
    <!-- Timepiece Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="100%" height="100%" fill="#FAF8F5" />
  
  <!-- Subtle design grids -->
  <line x1="100" y1="0" x2="100" y2="500" stroke="rgba(0, 0, 0, 0.02)" stroke-width="1" />
  <line x1="700" y1="0" x2="700" y2="500" stroke="rgba(0, 0, 0, 0.02)" stroke-width="1" />

  <!-- MAIN BROWSER LAYOUT FRAME -->
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.06)" stroke-width="1.5" filter="url(#shadow)" />
  
  <!-- Browser Header -->
  <path d="M 50 52 A 12 12 0 0 1 62 40 L 738 40 A 12 12 0 0 1 750 52 L 750 75 L 50 75 Z" fill="#F8FAFC" />
  <circle cx="75" cy="57" r="5" fill="#E2E8F0" />
  <circle cx="91" cy="57" r="5" fill="#E2E8F0" />
  <circle cx="107" cy="57" r="5" fill="#E2E8F0" />
  
  <!-- Site Logo & Menu items -->
  <text x="160" y="62" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="18" fill="#1E293B" letter-spacing="1">C H R O N O S</text>
  
  <g opacity="0.6">
    <rect x="420" y="54" width="45" height="6" rx="3" fill="#1E293B" />
    <rect x="485" y="54" width="55" height="6" rx="3" fill="#1E293B" />
    <rect x="560" y="54" width="40" height="6" rx="3" fill="#1E293B" />
  </g>
  
  <!-- Cart / Profile Icons -->
  <circle cx="670" cy="57" r="8" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="700" cy="57" r="8" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <path d="M 696 61 Q 700 55, 704 61" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- HERO SPLIT SECTION (LUXURY BRANDING) -->
  
  <!-- Left Side: Typography -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="80" height="16" rx="8" fill="rgba(217, 119, 6, 0.08)" />
    <text x="40" y="11" font-size="9" font-weight="700" fill="#D97706" text-anchor="middle" letter-spacing="0.5">EXQUISITE CRAFT</text>
    
    <text x="0" y="50" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="600" fill="#1E293B" letter-spacing="-0.5">Define Your</text>
    <text x="0" y="90" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="600" fill="#1E293B" letter-spacing="-0.5">Signature Time.</text>
    
    <text x="0" y="125" font-size="12" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif;">Experience Swiss-made excellence designed</text>
    <text x="0" y="143" font-size="12" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif;">for modern leaders and visionary minds.</text>
    
    <!-- CTA Button -->
    <rect x="0" y="175" width="140" height="42" rx="4" fill="url(#darkGrad)" />
    <text x="70" y="200" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">EXPLORE COLLECTION</text>
    
    <!-- Secondary button -->
    <rect x="155" y="175" width="110" height="42" rx="4" fill="none" stroke="#E2E8F0" stroke-width="1" />
    <text x="210" y="200" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">OUR HERITAGE</text>
  </g>

  <!-- Right Side: Luxury Timepiece Graphic Showcase -->
  <g transform="translate(480, 110)">
    <!-- Elegant Background Radial Shadow -->
    <circle cx="120" cy="140" r="110" fill="rgba(217, 119, 6, 0.03)" />
    <circle cx="120" cy="140" r="90" fill="rgba(15, 23, 42, 0.02)" />

    <!-- TIMEPIECE BODY DRAWING -->
    <!-- Metal Casing -->
    <circle cx="120" cy="140" r="80" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#goldGlow)" />
    <circle cx="120" cy="140" r="75" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" />
    
    <!-- Dial face ticks (Clock points) -->
    <line x1="120" y1="71" x2="120" y2="78" stroke="url(#goldGrad)" stroke-width="2.5" />
    <line x1="120" y1="209" x2="120" y2="202" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="51" y1="140" x2="58" y2="140" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="189" y1="140" x2="182" y2="140" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Dial center piece -->
    <circle cx="120" cy="140" r="6" fill="#FBBF24" />
    
    <!-- Watch Hands -->
    <!-- Hour Hand -->
    <line x1="120" y1="140" x2="150" y2="120" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <!-- Minute Hand -->
    <line x1="120" y1="140" x2="120" y2="92" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <!-- Seconds Hand (Red) -->
    <line x1="120" y1="140" x2="90" y2="165" stroke="#D97706" stroke-width="1" stroke-linecap="round" />
    
    <!-- Inner complex design overlay -->
    <circle cx="120" cy="140" r="45" fill="none" stroke="rgba(251, 191, 36, 0.15)" stroke-width="1" stroke-dasharray="2,3" />
    <circle cx="120" cy="140" r="30" fill="none" stroke="rgba(251, 191, 36, 0.1)" stroke-width="1" />
    
    <!-- Floating Stats cards (Ecom specific micro-interactions) -->
    <g transform="translate(-110, 160)">
      <rect x="0" y="0" width="120" height="52" rx="8" fill="#FFFFFF" filter="url(#shadow)" stroke="rgba(0,0,0,0.03)" stroke-width="1" />
      <text x="15" y="20" font-size="9" font-weight="700" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif;">THE ROYAL CROWN</text>
      <text x="15" y="38" font-size="14" font-weight="800" fill="#1E293B">$14,800</text>
      <circle cx="100" cy="28" r="8" fill="#10B981" />
      <path d="M 97 28 L 99 30 L 103 26" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
  </g>
</svg>
