<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0F131C; font-family:'Plus Jakarta Sans', sans-serif;">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="#080B11" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Background Glowing Blobs -->
  <circle cx="200" cy="150" r="180" fill="#6366F1" opacity="0.15" filter="url(#glow)" />
  <circle cx="650" cy="350" r="150" fill="#10B981" opacity="0.1" filter="url(#glow)" />

  <!-- DASHBOARD WINDOW WINDOW FRAME -->
  <rect x="50" y="40" width="700" height="420" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  
  <!-- Window Header Bar -->
  <path d="M 50 52 A 12 12 0 0 1 62 40 L 738 40 A 12 12 0 0 1 750 52 L 750 75 L 50 75 Z" fill="#111827" opacity="0.5" />
  
  <!-- Window Controls (Red, Yellow, Green Dots) -->
  <circle cx="75" cy="57" r="6" fill="#EF4444" />
  <circle cx="95" cy="57" r="6" fill="#F59E0B" />
  <circle cx="115" cy="57" r="6" fill="#10B981" />
  
  <!-- Window Title -->
  <text x="400" y="62" fill="rgba(255, 255, 255, 0.4)" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">FINANCELY ANALYTICS</text>

  <!-- SIDEBAR NAVIGATION -->
  <rect x="50" y="75" width="160" height="385" fill="#111827" opacity="0.3" />
  
  <!-- Sidebar Menu Items -->
  <rect x="65" y="100" width="130" height="28" rx="6" fill="url(#primaryGrad)" opacity="0.15" />
  <rect x="75" y="110" width="8" height="8" rx="2" fill="#6366F1" />
  <rect x="95" y="111" width="75" height="6" rx="3" fill="#6366F1" />
  
  <!-- Sidebar Skeleton Items -->
  <g opacity="0.4">
    <circle cx="79" cy="155" r="5" fill="#94A3B8" /> <rect x="95" y="152" width="65" height="6" rx="3" fill="#94A3B8" />
    <circle cx="79" cy="195" r="5" fill="#94A3B8" /> <rect x="95" y="192" width="80" height="6" rx="3" fill="#94A3B8" />
    <circle cx="79" cy="235" r="5" fill="#94A3B8" /> <rect x="95" y="232" width="55" height="6" rx="3" fill="#94A3B8" />
    <circle cx="79" cy="275" r="5" fill="#94A3B8" /> <rect x="95" y="272" width="70" height="6" rx="3" fill="#94A3B8" />
  </g>
  
  <!-- Upgrade Banner in Sidebar -->
  <rect x="65" y="340" width="130" height="90" rx="8" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1" />
  <rect x="77" y="360" width="106" height="6" rx="3" fill="#6366F1" opacity="0.8" />
  <rect x="77" y="375" width="80" height="4" rx="2" fill="#94A3B8" opacity="0.6" />
  <rect x="77" y="398" width="60" height="18" rx="4" fill="#6366F1" />

  <!-- MAIN CONTENT AREA -->
  
  <!-- Top Stat Cards -->
  <g transform="translate(230, 95)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="150" height="80" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <rect x="15" y="15" width="60" height="6" rx="3" fill="#94A3B8" opacity="0.5" />
    <text x="15" y="48" fill="#FFFFFF" font-size="20" font-weight="800">$124.5k</text>
    <rect x="15" y="58" width="40" height="4" rx="2" fill="#10B981" />
    
    <!-- Card 2 -->
    <rect x="170" y="0" width="150" height="80" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <rect x="185" y="15" width="50" height="6" rx="3" fill="#94A3B8" opacity="0.5" />
    <text x="185" y="48" fill="#FFFFFF" font-size="20" font-weight="800">1,482</text>
    <rect x="185" y="58" width="40" height="4" rx="2" fill="#6366F1" />
    
    <!-- Card 3 -->
    <rect x="340" y="0" width="150" height="80" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <rect x="355" y="15" width="70" height="6" rx="3" fill="#94A3B8" opacity="0.5" />
    <text x="355" y="48" fill="#FFFFFF" font-size="20" font-weight="800">99.4%</text>
    <rect x="355" y="58" width="40" height="4" rx="2" fill="#F59E0B" />
  </g>

  <!-- Big Line Chart Card -->
  <g transform="translate(230, 195)">
    <rect x="0" y="0" width="490" height="240" rx="8" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    
    <!-- Chart Header -->
    <rect x="20" y="20" width="100" height="8" rx="4" fill="#FFFFFF" opacity="0.8" />
    <rect x="20" y="36" width="60" height="5" rx="2" fill="#94A3B8" opacity="0.4" />
    
    <!-- Legend indicators -->
    <circle cx="420" cy="24" r="4" fill="#6366F1" />
    <rect x="430" y="21" width="30" height="6" rx="3" fill="#94A3B8" opacity="0.5" />
    
    <!-- Chart Grid Lines -->
    <line x1="20" y1="90" x2="470" y2="90" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    <line x1="20" y1="130" x2="470" y2="130" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    <line x1="20" y1="170" x2="470" y2="170" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    <line x1="20" y1="210" x2="470" y2="210" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    
    <!-- Chart Area Fill -->
    <path d="M 20 210 L 20 180 Q 70 140, 110 160 T 210 110 T 310 130 T 410 80 L 470 70 L 470 210 Z" fill="url(#purpleGlow)" />
    
    <!-- Chart Line splines -->
    <path d="M 20 180 Q 70 140, 110 160 T 210 110 T 310 130 T 410 80 L 470 70" fill="none" stroke="url(#primaryGrad)" stroke-width="3.5" filter="url(#glow)" />
    <path d="M 20 195 Q 80 180, 130 190 T 230 160 T 330 150 T 430 120 L 470 115" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="4,4" stroke-width="2" />
    
    <!-- Interaction point highlight -->
    <circle cx="310" cy="130" r="6" fill="#FFFFFF" stroke="#6366F1" stroke-width="3" />
    <rect x="275" y="70" width="70" height="35" rx="6" fill="#1E293B" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="310" y="91" fill="#10B981" font-size="11" font-weight="800" text-anchor="middle">+$4,210</text>
  </g>
</svg>
