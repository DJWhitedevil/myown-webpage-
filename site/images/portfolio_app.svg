<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#090F0E; font-family:'Plus Jakarta Sans', sans-serif;">
  <defs>
    <!-- Glow filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2E26" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0B1511" stop-opacity="0.6" />
    </linearGradient>

    <!-- App Screen Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Solid Dark Obsidian Background -->
  <rect width="100%" height="100%" fill="#080E0D" />

  <!-- Background Glowing Orbs -->
  <circle cx="600" cy="200" r="180" fill="#10B981" opacity="0.12" filter="url(#emeraldGlow)" />
  <circle cx="150" cy="300" r="150" fill="#06B6D4" opacity="0.08" filter="url(#emeraldGlow)" />

  <!-- MAIN CANVAS BROWSER FRAME -->
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#0C1412" stroke="rgba(16, 185, 129, 0.08)" stroke-width="1.5" />
  
  <!-- Browser Header Bar -->
  <path d="M 50 52 A 12 12 0 0 1 62 40 L 738 40 A 12 12 0 0 1 750 52 L 750 75 L 50 75 Z" fill="#080E0C" />
  <circle cx="75" cy="57" r="5" fill="#152B24" />
  <circle cx="91" cy="57" r="5" fill="#152B24" />
  <circle cx="107" cy="57" r="5" fill="#152B24" />

  <!-- Site Logo & Menu items -->
  <circle cx="155" cy="57" r="6" fill="url(#emeraldGrad)" />
  <text x="170" y="62" font-weight="800" font-size="14" fill="#FFFFFF" letter-spacing="1">PULSE</text>

  <!-- Content Section -->
  
  <!-- Left Side: Copy and Stats widgets -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="90" height="18" rx="9" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />
    <text x="45" y="12" font-size="9" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="0.5">HEALTH TECH</text>
    
    <text x="0" y="52" font-weight="800" font-size="32" fill="#FFFFFF" letter-spacing="-0.5">Smart Companion</text>
    <text x="0" y="90" font-weight="800" font-size="32" fill="#FFFFFF" letter-spacing="-0.5">For Your Longevity</text>
    
    <text x="0" y="128" font-size="13" fill="#8FA39E">Experience proactive wellness metrics designed to keep</text>
    <text x="0" y="146" font-size="13" fill="#8FA39E">your heart, activity, and sleep inside the ideal zone.</text>

    <!-- Glassmorphic Live Card in Hero -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="220" height="75" rx="10" fill="url(#glassGrad)" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1.2" />
      
      <!-- Heart Icon -->
      <path d="M 25 32 C 25 20, 45 20, 45 32 C 45 42, 25 50, 25 50 C 25 50, 5 42, 5 32 C 5 20, 25 20, 25 32" fill="#EF4444" transform="translate(15, -4)" />
      
      <text x="65" y="28" font-size="10" font-weight="600" fill="#8FA39E">AVERAGE PULSE</text>
      <text x="65" y="52" font-size="24" font-weight="800" fill="#FFFFFF">72<tspan font-size="14" font-weight="500" fill="#10B981"> bpm</tspan></text>
      
      <!-- Cardiac wave mini spline -->
      <path d="M 150 45 L 160 45 L 165 30 L 170 55 L 175 25 L 180 48 L 185 45 L 195 45" fill="none" stroke="#EF4444" stroke-width="2" filter="url(#cardShadow)" />
    </g>
  </g>

  <!-- Right Side: ISOMETRIC / FLOATING SMARTPHONE SCREEN PREVIEW -->
  <g transform="translate(480, 95)" filter="url(#cardShadow)">
    
    <!-- Phone Casing Outer -->
    <rect x="0" y="0" width="160" height="310" rx="24" fill="#040706" stroke="rgba(16, 185, 129, 0.15)" stroke-width="3" />
    <!-- Phone Screen Inner -->
    <rect x="6" y="6" width="148" height="298" rx="18" fill="#0B1311" />
    
    <!-- Phone Notch -->
    <rect x="45" y="6" width="70" height="12" rx="6" fill="#040706" />
    
    <!-- Fitness Concentric Ring Widget -->
    <g transform="translate(80, 75)">
      <!-- Ring 1 Background -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="rgba(16, 185, 129, 0.1)" stroke-width="6" />
      <!-- Ring 1 Active -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-dasharray="200" stroke-dashoffset="50" stroke-linecap="round" />
      
      <!-- Ring 2 Background -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="rgba(6, 182, 212, 0.1)" stroke-width="6" />
      <!-- Ring 2 Active -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#06B6D4" stroke-width="6" stroke-dasharray="140" stroke-dashoffset="30" stroke-linecap="round" />
      
      <!-- Core value inside ring -->
      <text x="0" y="4" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">84%</text>
    </g>
    
    <!-- Sleep metric panel -->
    <g transform="translate(16, 135)">
      <rect x="0" y="0" width="128" height="52" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(16, 185, 129, 0.08)" stroke-width="1" />
      <text x="12" y="18" font-size="8" font-weight="700" fill="#8FA39E">SLEEP QUALITY</text>
      <text x="12" y="38" font-size="16" font-weight="800" fill="#34D399">7h 48m</text>
      <rect x="90" y="20" width="26" height="14" rx="7" fill="rgba(52, 211, 153, 0.1)" />
      <text x="103" y="30" font-size="7" font-weight="800" fill="#34D399" text-anchor="middle">OPT</text>
    </g>

    <!-- Hydration Alert Banner inside App (Floating interaction) -->
    <g transform="translate(16, 205)">
      <rect x="0" y="0" width="128" height="75" rx="8" fill="rgba(16, 185, 129, 0.05)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.2" />
      <circle cx="25" cy="25" r="10" fill="#06B6D4" />
      <!-- Drop symbol -->
      <path d="M 25 20 C 25 20, 28 24, 28 26 C 28 28, 26 29, 25 29 C 24 29, 22 28, 22 26 C 22 24, 25 20, 25 20" fill="#FFFFFF" />
      
      <text x="44" y="22" font-size="8" font-weight="700" fill="#FFFFFF">HYDRATION REMINDER</text>
      <text x="44" y="33" font-size="7" fill="#8FA39E">Target: 3.2 Liters today</text>
      
      <!-- Progress Bar -->
      <rect x="12" y="52" width="104" height="4" rx="2" fill="rgba(255,255,255,0.05)" />
      <rect x="12" y="52" width="70" height="4" rx="2" fill="#06B6D4" />
      
      <text x="12" y="66" font-size="7" font-weight="700" fill="#06B6D4">2.1L DRUNK</text>
    </g>
  </g>

  <!-- Outer Floating Stats badge (Build depth) -->
  <g transform="translate(620, 280)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="100" height="54" rx="8" fill="#0B1311" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1" />
    <text x="12" y="18" font-size="8" font-weight="700" fill="#8FA39E">CALORIES</text>
    <text x="12" y="38" font-size="16" font-weight="800" fill="#FFFFFF">2,480</text>
    <path d="M 80 20 L 85 25 L 75 35" fill="none" stroke="#10B981" stroke-width="2.5" />
  </g>
</svg>
